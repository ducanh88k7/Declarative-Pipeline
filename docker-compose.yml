services:
  api:
    image: ${IMAGE_TAG:-cv-ranker-lab:local}
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: cvranker
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: cache
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
      - lab-network

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: cvranker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lab-network

  cache:
    image: redis:7-alpine
    networks:
      - lab-network

volumes:
  db-data:

networks:
  lab-network:
    driver: bridge